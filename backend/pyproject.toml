[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "fastmcp>=4.0.10",
    "langchain>=1.3.18",
    "langchain-openai>=1.6.0",
    "pypdf>=6.16.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "fpdf2>=2.8.8",
    "pytest>=9.1.1",
]
[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "slow: makes a real API call, costs money, skip with -m 'not slow'",
]
